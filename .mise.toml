# mise configuration for Herdr-Vibe integration
# https://mise.jdx.dev/

[env]
# Global environment variables for the project
NODE_VERSION = "26.7.0"
PNPM_VERSION = "11.24.0"
PYTHON_VERSION = "3.11.11"

[tools]
# Node.js runtime (26.x required for pnpm@11.24.0 which needs node >= 22.13)
node = "26.7.0"

# Python runtime
python = "3.11.11"

[tasks]
# Install all dependencies
install = "pnpm install -r"

# Type checking
"typecheck:ts" = "cd adapter && pnpm typecheck"
"typecheck:py" = "cd adapter && python -m mypy --strict herdr-agent-state.py install.py"
"typecheck" = "mise run typecheck:ts && mise run typecheck:py"

# Linting
"lint:ts" = "cd adapter && pnpm lint:ts"
"lint:py" = "cd adapter && python -m ruff check herdr-agent-state.py install.py"
"lint" = "mise run lint:ts && mise run lint:py"

# Formatting
"format:ts" = "cd adapter && pnpm exec oxfmt src/**/*.ts"
"format:py" = "python -m ruff format adapter/*.py"
"format" = "mise run format:ts && mise run format:py"

# Build
"build:ts" = "cd adapter && pnpm build"
"build" = "mise run build:ts"

# Full check
"check" = "mise run typecheck && mise run lint && mise run build"

# Development
"dev" = "cd adapter && pnpm dev"
"test" = "cd adapter && pnpm test"

# ==========================================================================
# COVERAGE TASKS
# ==========================================================================
# TypeScript coverage - locked at current baseline (2026-09-01)
#   Statements: 34.12% (72/211) - CANNOT go below
#   Branches: 63.15% (12/19) - CANNOT go below
#   Functions: 53.84% (7/13) - CANNOT go below
#   Lines: 34.12% (72/211) - CANNOT go below
# ==========================================================================

# TypeScript: Run tests with coverage (thresholds enforced by vitest.config.ts)
# Current baseline (2026-09-01): Statements 34.12%, Branches 63.15%, Functions 53.84%, Lines 34.12%
# Locked in - CANNOT go below
"test:ts:coverage" = "cd adapter && pnpm test:coverage"

# Python: Run unit tests with coverage
# Current baseline (2026-09-01): 40.65% overall
# Locked in - CANNOT go below
"test:py:coverage" = "cd adapter && python3 -m pytest tests/ --cov=herdr_agent_state --cov=install --cov-report=term-missing --cov-report=html --cov-fail-under=40"

# Full coverage check - both TS and Python
"test:coverage" = "mise run test:ts:coverage && mise run test:py:coverage"

# CI-like full check with coverage
"ci" = "mise run typecheck && mise run lint && mise run build && mise run test:coverage"
