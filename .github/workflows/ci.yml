name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install Node dependencies
        run: |
          cd adapter
          pnpm install --frozen-lockfile

      # ============================================================
      # TYPESCRIPT COVERAGE CHECK
      # ============================================================
      # Current baseline (2026-09-01):
      #   Statements: 34.12%
      #   Branches: 63.15%
      #   Functions: 53.84%
      #   Lines: 34.12%
      # Locked in - CANNOT go below these numbers
      # ============================================================
      - name: Run TypeScript tests with coverage
        run: |
          cd adapter
          pnpm run test:coverage

      # ============================================================
      # PYTHON COVERAGE CHECK
      # ============================================================
      # Current baseline (2026-09-01): 41% overall
      # Locked in - CANNOT go below this number
      # ============================================================
      - name: Run Python tests with coverage
        run: |
          cd adapter
          python -m pytest tests/ --cov=herdr_agent_state --cov=install --cov-report=term-missing --cov-report=html --cov-fail-under=40

      # ============================================================
      # COVERAGE ENFORCEMENT
      # ============================================================
      # Both TypeScript and Python coverage must pass
      # Vitest handles TS thresholds via vitest.config.ts
      # Python coverage is checked via pytest-cov
      # ============================================================

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          cd adapter
          pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: |
          cd adapter
          pnpm run typecheck

      - name: TypeScript lint
        run: |
          cd adapter
          pnpm run lint:ts

      - name: Python type check
        run: |
          cd adapter
          python -m mypy --strict herdr_agent_state.py install.py

      - name: Python lint
        run: |
          cd adapter
          python -m ruff check herdr_agent_state.py install.py
