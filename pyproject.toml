[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "herdr-vibe-integration"
version = "0.1.0"
description = "Herdr integration adapter for Mistral Vibe"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = []

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.5",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
check_untyped_defs = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
strict_concatenate = true
warn_incomplete_stub = true
warn_signature_comparison = true
implicit_reexport = false
allow_untyped_globals = false
allow_redefinition = false
enable_error_code = ["ignore-without-code"]

[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["node_modules", "dist", ".venv", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
# F: unused vars/imports, redundant casts; ANN: require explicit types; F403: no wildcard imports
select = ["F", "ANN", "F403"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
